# AETHER BAYESIAN KERNEL (ABK) // SYSTEM CONFIGURATION
# Institutional Parameter Set - Version 3.5.0

# --- GLOBAL SYSTEM ENVIRONMENT ---
system:
  base_currency: "USD"
  log_level: "INFO"

# --- DATA INGESTION PARAMETERS ---
data:
  provider: "yfinance"
  min_volume_threshold: 100000 

# --- RECURSIVE KERNEL CONFIGURATION ---
regime_model:
  n_components: 5
  # Relativistic Feature Mapping
  features: ['v', 'r', 'c', 'a', 'd', 'l', 'b']
  
  # --- FIX: ADDED MISSING HMM PATH ---
  model_save_path: "models/regime_hmm_v2.pkl"
  instinct_save_path: "models/base_instinct.pkl"
  
  # Adaptive Learning Hyperparameters
  abmsm:
    learning_rate: 0.02
    decay_factor: 0.99
    save_path: "models/proprietary_abmsm.pkl"

# --- INSTITUTIONAL RISK CONTROLS ---
risk:
  target_volatility: 0.25
  max_portfolio_leverage: 2.0
  entropy_threshold: 0.85

# --- ACCOUNT BASIS ---
portfolio:
  initial_capital: 100000