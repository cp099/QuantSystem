# ======================================================
# System Configuration V2.0
# ======================================================

system:
  base_currency: "USD"
  log_level: "INFO"

data:
  provider: "yfinance"
  # Thresholds for liquidity filtering
  min_volume_threshold: 100000 

regime_model:
  n_components: 5
  # Three Senses: Direction, Risk, Compression
  features: ['Normalized_return', 'Atr', 'Vol_ratio']
  # instinct_models/ will store the 'Global Knowledge'
  instinct_save_path: "models/base_instinct.pkl"
  abmsm:
    learning_rate: 0.02 # Increased alpha for faster stock-specific adaptation
    decay_factor: 0.99  # Slightly lower lambda for better memory turnover
    save_path: "models/proprietary_abmsm.pkl"

risk:
  target_volatility: 0.25 # Institutional standard
  max_portfolio_leverage: 2.0
  entropy_threshold: 0.85 # Loosened from 0.7 to allow high-growth trades (NVDA)

portfolio:
  initial_capital: 100000