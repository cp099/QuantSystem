# ======================================================
# System Configuration V2.0
# ======================================================

# -- System-Wide Settings --
system:
  base_currency: "USD"
  log_level: "INFO"

# -- Data Ingestion & Universe --
data:
  provider: "yfinance"
  # Universe is now a list of dictionaries for scalability
  universe:
    - { symbol: "SPY", currency: "USD", asset_class: "equity_index" }
    # Example for future expansion:
    # - { symbol: "^GDAXI", currency: "EUR", asset_class: "equity_index" }
    # - { symbol: "EURUSD=X", currency: "USD", asset_class: "fx" }

# -- Regime Classification Model --
regime_model:
  n_components: 4 # Number of hidden states (regimes)
  features: ['Vol_ratio', 'Momentum', 'Vol_short'] # Features used for training
  model_save_path: "models/regime_hmm_v1.pkl"

# -- Risk Management Parameters --
risk:
  target_volatility: 0.20
  max_position_leverage: 1.5
  max_portfolio_leverage: 2.0
  stop_loss_atr_multiple: 3.0

# -- Portfolio & Strategy Settings --
portfolio:
  initial_capital: 100000
  execution_state_file: "data/processed/portfolio_state.json"